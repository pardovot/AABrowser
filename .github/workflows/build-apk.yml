name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AABrowser-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
        
    - name: Build Release APK (unsigned)
      run: ./gradlew assembleRelease --stacktrace || echo "Release build failed (expected without signing keys)"
      continue-on-error: true
      
    - name: Upload Release APK (if built)
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: AABrowser-Release-APK
        path: app/build/renamedApks/release/*.apk
        retention-days: 30
