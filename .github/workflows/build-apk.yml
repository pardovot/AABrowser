name: Build Android APK

on:
  push:
    branches: [ main, master, allow-while-driving ]
  pull_request:
    branches: [ main, master, allow-while-driving ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > release.keystore
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AABrowser-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
        
    - name: Build Release APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
        RELEASE_STORE_FILE: ../release.keystore
        RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      if: env.KEYSTORE_BASE64 != ''
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Verify APK signature
      if: hashFiles('app/build/renamedApks/release/*.apk') != ''
      run: |
        APK_PATH=$(find app/build/renamedApks/release -name "*.apk" | head -n 1)
        if [ -f "$APK_PATH" ]; then
          echo "Verifying signature of: $APK_PATH"
          $JAVA_HOME/bin/jarsigner -verify -verbose -certs "$APK_PATH"
          echo ""
          echo "Checking zipalign status:"
          $ANDROID_HOME/build-tools/*/zipalign -c -v 4 "$APK_PATH" || echo "APK is not zipaligned!"
        fi
      
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: hashFiles('app/build/renamedApks/release/*.apk') != ''
      with:
        name: AABrowser-Release-APK
        path: app/build/renamedApks/release/*.apk
        retention-days: 30
